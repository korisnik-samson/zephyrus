# ═══════════════════════════════════════════════════════════
# Zephyrus Backend — Main Configuration
# ═══════════════════════════════════════════════════════════

# ── Application ────────────────────────────────────────────
spring.application.name=zephyrus

# ── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:zephyrus}
spring.datasource.username=${POSTGRES_USER:zephyrus}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.main.allow-bean-definition-overriding=true

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Redis ──────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000

# ── Jackson ────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ── Server ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ── JWT ────────────────────────────────────────────────────
application.jwt.secret=${JWT_SECRET:zephyrus-dev-secret-key-change-this-in-production-must-be-256-bits}
application.jwt.access-token-expiry=${JWT_ACCESS_EXPIRY:900000}
application.jwt.refresh-token-expiry=${JWT_REFRESH_EXPIRY:604800000}

# ── CORS ───────────────────────────────────────────────────
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── TMDB ───────────────────────────────────────────────────
application.tmdb.api-key=${TMDB_API_KEY:}
application.tmdb.base-url=https://api.themoviedb.org/3
application.tmdb.image-base-url=https://image.tmdb.org/t/p

# ── SpringDoc / Swagger ────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
