# ═══════════════════════════════════════════════════════════
# Zephyrus Backend — Development Profile
# ═══════════════════════════════════════════════════════════

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.clean-disabled=false
spring.main.allow-bean-definition-overriding=true

# ── Meilisearch (enabled in dev; pairs with docker-compose meilisearch service) ──
# Master key defaults to "masterKey" in both app and docker-compose, so this
# works out-of-the-box after `docker compose up -d` with no .env needed.
application.meilisearch.enabled=true

# ── Logging ────────────────────────────────────────────────
logging.level.com.samson.zephyrus=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
